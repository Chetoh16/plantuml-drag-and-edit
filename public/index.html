<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <!-- Favicons for different devices -->
     
    <!-- Modern browsers: Scalable SVG -->
    <link rel="icon" type="image/svg+xml" href="/assets/plantuml-drag-logo.svg" />

    <!-- Standard PNG fallback -->
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/plantuml-drag-logo.png" />

    <!-- Apple Home Screen / iOS Bookmark -->
    <link rel="apple-touch-icon" href="/assets/plantuml-drag-logo.png" />


    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlantUML Drag & Edit</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app-container" id="appContainer">

        <!-- Left Sidebar Column -->
        <div class="editor-column" id="editorColumn">
            <div class="editor-header">
                <img src="/assets/plantuml-drag-logo.png" alt="Logo" class="header-logo">
                <h2>PlantUML Drag & Edit</h2>
            </div>
            
            <textarea id="code" placeholder="Type PlantUML code here...">@startuml
class Order
class Customer
Customer --> Order
@enduml</textarea>

            <div class="editor-footer">
                <button id="renderBtn" type="button">Render Diagram</button>
            </div>
        </div>

        <!-- Draggable Split Bar -->
        <div id="resizer" class="resizer"></div>

        <!-- Right Diagram Dragging Area -->
        <!-- svgHost holds the diagram viewer and the export buttons -->
        <div id="svgHost" class="diagram-column">

            <!-- svgCanvas is the rendered diagram and gets updated on each render -->
            <div id="svgCanvas" class="svg-canvas"></div>

            <div id="exportBar" class="export-bar">
                <button id="exportSvgBtn" type="button" title="Export as SVG">Export SVG</button>
                <button id="exportPngBtn" type="button" title="Export as PNG">Export PNG</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
